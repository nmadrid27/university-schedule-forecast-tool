name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    # Branch trigger builds the installer on each push to the release branch
    # so the Windows build stays validated while iterating. Tag pushes (v*)
    # remain the release trigger.
    branches: ["feat/desktop-packaging"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build frontend (static export)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Run PyInstaller
        run: pyinstaller --noconfirm --clean --workpath .pyi-build --distpath dist build/forecast_tool.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCAD-Forecast-Tool-Windows
          path: dist/SCAD-Forecast-Tool-Setup.exe
